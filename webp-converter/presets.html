<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saved Presets — toolkit.artline-studio.de</title>
  <link rel="icon" href="assets/images/fav-icon.png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/scss/main.css"/>
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <script>(function(){var t=localStorage.getItem('toolkit-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();</script>
</head>
<body>
<div class="update-strip" id="updateStrip">
  <div class="container-xl px-3 d-flex align-items-center gap-3">
    <i class="bi bi-arrow-up-circle me-1"></i>
    <span id="updateMsg" class="me-auto">A new version is available!</span>
    <button class="btn btn-dark btn-sm" id="updateNowBtn"><i class="bi bi-arrow-clockwise me-1"></i>Update Now</button>
    <button class="close-strip" id="updateDismiss" style="background:none;border:none;color:rgba(0,0,0,.6);font-size:20px;cursor:pointer;padding:0 6px">&times;</button>
  </div>
</div>
  <div id="tk-nav"></div>
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title"><i class="bi bi-stars"></i> WebP Converter</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-1 px-2">
    <p style="font-size:10px;letter-spacing:.08em;color:var(--bs-tertiary-color);font-family:var(--bs-font-monospace);text-transform:uppercase;font-weight:600" class="px-2">Navigation</p>
    <a class="sidebar-nav-link" href="index.html"><i class="bi bi-stars"></i> Converter</a>
    <a class="sidebar-nav-link" href="history.html"><i class="bi bi-clock-history"></i> History</a>
    <a class="sidebar-nav-link" href="stats.html"><i class="bi bi-bar-chart-fill"></i> Statistics</a>
    <a class="sidebar-nav-link  active" href="presets.html"><i class="bi bi-sliders"></i> Saved Presets</a>
    <a class="sidebar-nav-link" href="../pagespeed/index.html"><i class="bi bi-speedometer2"></i> PageSpeed</a>
    <a class="sidebar-nav-link" href="changelog.html"><i class="bi bi-git"></i> Changelog</a>
    <hr style="border-color:var(--bs-border-color)"/>
    <p style="font-size:10px;letter-spacing:.08em;color:var(--bs-tertiary-color);font-family:var(--bs-font-monospace);text-transform:uppercase;font-weight:600" class="px-2">Stats</p>
    <div class="px-2 d-flex flex-column gap-2">
      <div class="sidebar-stat-row"><div class="sidebar-stat-row__icon"><i class="bi bi-images"></i></div><div><div class="sidebar-stat-row__lbl">Conversions</div><div class="sidebar-stat-row__val" id="sidebarConversions">0</div></div></div>
      <div class="sidebar-stat-row"><div class="sidebar-stat-row__icon"><i class="bi bi-compress"></i></div><div><div class="sidebar-stat-row__lbl">Space Saved</div><div class="sidebar-stat-row__val" id="sidebarSaved">0 B</div></div></div>
    </div>
    <div class="mt-auto px-2 pb-2" style="font-size:11px;color:var(--bs-tertiary-color);font-family:var(--bs-font-monospace)">WebP Converter Pro v2.0</div>
  </div>
</div>
<div class="page-topbar">
  <div class="container-xl px-3 d-flex align-items-center gap-3">
    <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button>
    <span class="topbar-title"><i class="bi bi-sliders"></i> Saved Presets</span>
  </div>
</div>

<div class="container-xl px-3 py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div class="section-head"><h2><i class="bi bi-sliders"></i> Saved Presets</h2><p>Load saved converter settings</p></div>
    <a class="btn btn-primary btn-sm" href="index.html"><i class="bi bi-plus me-1"></i>New Preset</a>
  </div>
  <div class="row g-3" id="presetsGrid"></div>
</div>
<div class="app-toast" id="appToast"></div>
<div id="tk-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/components.js"></script>
<script src="assets/js/update-checker.js"></script>
<script>
$(function(){
  function fmtSize(b){if(!b)return'0 B';const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(Math.max(b,1))/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(2))+' '+s[i];}
  var fmtLabel={'image/webp':'WebP','image/jpeg':'JPEG','image/png':'PNG'};
  function render(){
    var p=JSON.parse(localStorage.getItem('converterPresets')||'[]');
    var $g=$('#presetsGrid');
    if(!p.length){
      $g.html('<div class="col-12"><div class="empty-state"><i class="bi bi-sliders"></i><h5>No saved presets</h5><p>Save your settings from the Converter page</p></div></div>');
      return;
    }
    $g.html(p.map(function(pr){
      return '<div class="col-12 col-sm-6 col-lg-4"><div class="preset-entry">'+
        '<div class="preset-entry__name mb-3">'+pr.name+'</div>'+
        '<div class="d-flex flex-column gap-1 mb-3">'+
          '<div class="preset-entry__row"><span class="preset-entry__lbl">Mode</span><span class="preset-entry__val">'+pr.convMode+'</span></div>'+
          '<div class="preset-entry__row"><span class="preset-entry__lbl">Format</span><span class="preset-entry__val">'+(fmtLabel[pr.targetFormat]||'WebP')+'</span></div>'+
          '<div class="preset-entry__row"><span class="preset-entry__lbl">Quality</span><span class="preset-entry__val">'+Math.round(pr.quality*100)+'%</span></div>'+
          '<div class="preset-entry__row"><span class="preset-entry__lbl">Size</span><span class="preset-entry__val">'+pr.targetW+'&times;'+pr.targetH+'</span></div>'+
        '</div>'+
        '<div class="d-flex gap-2">'+
          '<a class="btn btn-primary btn-sm flex-grow-1" href="index.html?preset='+pr.id+'"><i class="bi bi-check me-1"></i>Load</a>'+
          '<button class="btn btn-outline-danger btn-sm del-btn" data-id="'+pr.id+'"><i class="bi bi-trash"></i></button>'+
        '</div>'+
      '</div></div>';
    }).join(''));
  }
  render();
  $(document).on('click','.del-btn',function(){
    if(!confirm('Delete preset?'))return;
    var id=parseInt($(this).data('id'));
    var p=JSON.parse(localStorage.getItem('converterPresets')||'[]');
    p=p.filter(function(x){return x.id!==id;});
    localStorage.setItem('converterPresets',JSON.stringify(p));
    render();
  });
  const _h=JSON.parse(localStorage.getItem('converterHistory')||'[]');
    $('#sidebarConversions').text(_h.reduce(function(s,i){return s+i.fileCount;},0));
    $('#sidebarSaved').text(fmtSize(_h.reduce(function(s,i){return s+(i.originalSize-i.convertedSize);},0)));
});
</script>
</body></html>
